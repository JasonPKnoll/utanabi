name: Release

# A tag such as v0.1.0, pushed for the version in build/config.yml, builds the Mac app and publishes it as a GitHub
# release: Utanabi-<version>-macos.zip and its SHA-256, which the Homebrew cask and scripts/install.sh install.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Mac app
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the app's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^  version: "\([^"]*\)".*/\1/p' build/config.yml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "The tag is $TAG, but build/config.yml says $version. Tag v$version, or bump info.version." >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install tool
      - name: Build the dictionary
        run: wails3 task dictionary
      - name: Package the app
        run: scripts/package-macos.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" bin/release/*.zip bin/release/*.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Utanabi ${TAG#v}" \
            --notes "Utanabi ${TAG#v} for Mac (Apple silicon and Intel). Install with Homebrew: \`brew install --cask jasonpknoll/utanabi/utanabi\`, or: \`curl -fsSL https://raw.githubusercontent.com/JasonPKnoll/utanabi/main/scripts/install.sh | sh\`"
