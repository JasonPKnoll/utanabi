<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="-32 -32 64 64">
  <!-- The 16px favicon: fewer, thicker rays than favicon.svg, so it still reads in a browser tab. The source of
       frontend/public/favicon-16.png. -->
  <rect x="-32" y="-32" width="64" height="64" rx="14" fill="#0f1420"/>
  <g stroke="#f5b544" stroke-width="6" stroke-linecap="round">
    <line y1="-14" y2="-26"/>
    <line y1="-14" y2="-20" transform="rotate(45)"/>
    <line y1="-14" y2="-26" transform="rotate(90)"/>
    <line y1="-14" y2="-20" transform="rotate(135)"/>
    <line y1="-14" y2="-26" transform="rotate(180)"/>
    <line y1="-14" y2="-20" transform="rotate(225)"/>
    <line y1="-14" y2="-26" transform="rotate(270)"/>
    <line y1="-14" y2="-20" transform="rotate(315)"/>
  </g>
  <circle r="9" fill="#ff8fb8"/>
  <circle r="2.6" fill="#0f1420"/>
</svg>
